name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: mypy app --ignore-missing-imports
      - name: Case package integrity
        run: python -m app.cli validate-case
      - name: Tests (SQLite; mocked LLM providers)
        run: pytest

  backend-postgres:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: raaz, POSTGRES_PASSWORD: raaz, POSTGRES_DB: raaz }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raaz" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      RAAZ_DATABASE_URL: postgresql+psycopg://raaz:raaz@localhost:5432/raaz
      RAAZ_TEST_DATABASE_URL: postgresql+psycopg://raaz:raaz@localhost:5432/raaz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Apply migrations to a real PostgreSQL
        run: alembic upgrade head && alembic check
      - name: Concurrency / constraint tests against PostgreSQL
        run: pytest tests/test_security_ops.py tests/test_engine_flow.py tests/test_accusation.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push)
        run: |
          docker build --build-arg INSTALL_ML=0 -t raaz-api ./backend
          docker build -t raaz-web ./frontend
