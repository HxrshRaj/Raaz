# One-click backend on Render's free tier (Docker). The frontend is deployed separately on Vercel (frontend/vercel.json).
# Free tier notes: the service sleeps when idle (first request takes ~30-60 s) and the disk is ephemeral, so the SQLite
# database resets on every deploy/restart. Fine for a demo; for persistence set RAAZ_DATABASE_URL to a Postgres URL.
services:
  - type: web
    name: raaz-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    buildArgs:
      INSTALL_ML: "0"          # skip PyTorch: smaller, faster build; the game still runs (ML lead ranking is off)
    envVars:
      - key: RAAZ_ENV
        value: prod
      - key: RAAZ_JWT_SECRET
        generateValue: true
      - key: RAAZ_DATABASE_URL
        value: sqlite:////tmp/raaz.db
      - key: RAAZ_ARTIFACTS_DIR
        value: /tmp/artifacts
      - key: RAAZ_ALLOW_GUEST
        value: "true"
      - key: RAAZ_LLM_PROVIDER
        value: none
      - key: RAAZ_CORS_ORIGINS
        sync: false              # set to your Vercel URL, e.g. https://raaz.vercel.app
